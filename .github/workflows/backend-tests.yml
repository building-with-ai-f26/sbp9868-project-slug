name: CyberEye backend tests
on:
  push:
    paths:
      - 'server.py'
      - 'tests/**'
      - '.github/workflows/backend-tests.yml'
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate Python syntax
        run: python -m py_compile server.py tests/test_server.py
      - name: Run isolated backend tests (no API key required)
        run: python -m unittest discover -s tests -v

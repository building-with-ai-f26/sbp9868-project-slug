name: CyberEye backend tests
on:
  push:
    paths:
      - 'server.py'
      - 'docs/ocr.js'
      - 'tests/**'
      - '.github/workflows/backend-tests.yml'
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate Python syntax
        run: python -m py_compile server.py tests/test_server.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate screenshot OCR JavaScript syntax
        run: node --check docs/ocr.js
      - name: Run isolated backend tests (no API key required)
        run: python -m unittest discover -s tests -v
      - name: Audit the pinned browser OCR package and its dependencies
        working-directory: ${{ runner.temp }}
        run: |
          npm install --package-lock-only --ignore-scripts tesseract.js@7.0.0
          npm audit --audit-level=high
